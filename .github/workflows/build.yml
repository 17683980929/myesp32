name: Build MyEsp32 Firmware

# push 且固件目录有改动时自动编译；也支持手动触发
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "firmware/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仓库公开：WiFi 凭据只存在于 GitHub Secrets，编译时注入 sdkconfig.defaults，
      # 不会进入任何提交。Secrets 在仓库 Settings → Secrets and variables → Actions 配置。
      - name: Inject WiFi/server settings from repo secrets
        working-directory: firmware
        shell: bash
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
          if [ -n "$WIFI_SSID" ]; then
            printf 'CONFIG_WIFI_SSID="%s"\n' "$(esc "$WIFI_SSID")" >> sdkconfig.defaults
            printf 'CONFIG_WIFI_PASSWORD="%s"\n' "$(esc "$WIFI_PASSWORD")" >> sdkconfig.defaults
            echo "WiFi 凭据已注入（来自仓库 Secrets）"
          else
            echo "::warning::未配置仓库 Secret WIFI_SSID，固件将使用默认值 MyWiFi"
          fi
          if [ -n "$SERVER_HOST" ]; then
            printf 'CONFIG_SERVER_HOST="%s"\n' "$(esc "$SERVER_HOST")" >> sdkconfig.defaults
            echo "SERVER_HOST 已注入：$SERVER_HOST"
          fi

      - name: Build
        working-directory: firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build

      - name: Merge single image
        working-directory: firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py merge-bin -o merged-binary.bin

      - name: Show flash args
        working-directory: firmware
        shell: bash
        run: cat build/flash_args || true

      - name: Upload merged image
        uses: actions/upload-artifact@v4
        with:
          name: myesp32-merged
          path: |
            firmware/build/merged-binary.bin
            firmware/build/myesp32.bin
            firmware/build/flash_args
          if-no-files-found: error
          retention-days: 14

      - name: Upload individual bins (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: myesp32-bins
          path: |
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/edge_agent.bin
            firmware/build/myesp32.bin
            firmware/build/myesp32.elf
            firmware/build/srmodels/srmodels.bin
            firmware/build/flash_args
          if-no-files-found: warn
          retention-days: 14
