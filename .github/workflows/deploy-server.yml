name: Push Server Bundle

# 只改服务端/网页时走这条：打包 → 传到服务器 → 管理页点“应用并重启”
on:
  push:
    branches: [main, master]
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      FW_UPLOAD_TOKEN: ${{ secrets.FW_UPLOAD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip and upload
        if: env.FW_UPLOAD_TOKEN != ''
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          zip -qr /tmp/server.zip server/src server/skills server/data web \
            -x 'server/data/life-guide/*'
          ls -lh /tmp/server.zip
          code=$(curl -sS -o /tmp/up.json -w '%{http_code}' --max-time 90 \
            -X POST "https://0929.site/pet/api/server-bundle" \
            -H "X-FW-Token: $FW_UPLOAD_TOKEN" \
            -H "X-Commit: ${GITHUB_SHA::7}" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/server.zip) || code=000
          cat /tmp/up.json || true
          if [ "$code" = "200" ]; then
            echo "::notice::服务端包已上传，去 /pet/admin 点「应用并重启」"
          else
            echo "::warning::服务端包上传失败（HTTP $code）"
          fi
